<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Higher or Lower Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>Higher or Lower</h1>
        <p>Current Number: <span id="current-number">?</span></p>
        <p>Lives: <span id="lives">3</span> | Streak: <span id="streak">0</span> | Best Streak: <span id="best-streak">0</span></p>
        <button id="higher-btn">Higher</button>
        <button id="lower-btn">Lower</button>
        <p id="message"></p>
    </div>
    <script src="game.js" defer></script>
</body>
</html>
